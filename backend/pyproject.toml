[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "biorritmo-backend"
version = "1.0.0"
description = "Backend da plataforma BioRitmo — gestão de saúde pessoal"
authors = [{ name = "BioRitmo Dev Team" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "pydantic==2.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]


testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"